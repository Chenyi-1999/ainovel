worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  absolute_redirect off;
  client_max_body_size 64m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_authorization $app_authorization { default $http_authorization; ~*^Basic\s ""; }
  auth_request /_lab/verify;
  error_page 401 = @lab_login;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $app_authorization;
  proxy_set_header X-Instance-ID "";
  proxy_set_header X-User-ID "";
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  resolver 127.0.0.11 ipv6=off valid=10s;
  server { listen 8020; include /etc/nginx/lab-auth.conf; location / { set $target http://mumu:8000; proxy_pass $target; } }
  server { listen 8021; include /etc/nginx/lab-auth.conf; location / { set $target http://lite:80; proxy_pass $target; } }
  server { listen 8022; include /etc/nginx/lab-auth.conf; location / { set $target http://story:48090; proxy_pass $target; } }
  server {
    listen 8023;
    include /etc/nginx/lab-auth.conf;
    location = / { root /usr/share/nginx/html; try_files /cli.html =404; }
    location = /terminal { return 302 /terminal/; }
    location /terminal/ { set $target http://cli:7681; proxy_pass $target; }
  }
}

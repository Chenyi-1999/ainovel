location = /_lab/verify {
  internal;
  auth_request off;
  set $auth_target http://auth:8080;
  proxy_pass $auth_target;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
  proxy_intercept_errors off;
}
location = /_lab/login {
  auth_request off;
  set $auth_target http://auth:8080;
  proxy_pass $auth_target;
  proxy_intercept_errors off;
}
location = /_lab/logout {
  auth_request off;
  set $auth_target http://auth:8080;
  proxy_pass $auth_target;
  proxy_intercept_errors off;
}
location @lab_login { auth_request off; return 303 /_lab/login; }

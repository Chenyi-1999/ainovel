# Merge after deploy/reference-lab/compose.yaml. All paths use that base directory.
# Evaluation only: no model credentials, runtime egress, or directly published ports.
services:
  lite-api:
    build:
      context: ../../.reference-sources/lite/backend
    image: reference-lab-lite-api:d3bce7437861
    environment:
      # Upstream prod requires Secure cookies and RQ; this HTTP evaluation uses
      # upstream dev + SQLite/inline, with anonymous dev fallback disabled.
      APP_ENV: dev
      LOG_LEVEL: WARNING
      DATABASE_URL: sqlite:////data/lite.db
      WAIT_FOR_DB: "1"
      WEB_CONCURRENCY: "1"
      TASK_QUEUE_BACKEND: inline
      INLINE_WORKER_CONCURRENCY: "1"
      AUTH_DEV_FALLBACK_USER_ID: ""
      AUTH_ADMIN_USER_ID: ${LITE_ADMIN_USER:-lab-admin}
      AUTH_ADMIN_PASSWORD: ${LITE_ADMIN_PASSWORD:?Set a unique strong Lite administrator password}
      AUTH_ADMIN_DISPLAY_NAME: Lite evaluation
      AUTH_SESSION_SIGNING_KEY: ${LITE_SESSION_SIGNING_KEY:?Set a unique random Lite session signing key}
      AUTH_COOKIE_USER_ID_NAME: lite_session
      AUTH_COOKIE_EXPIRE_AT_NAME: lite_session_expiry
      AUTH_COOKIE_SAMESITE: lax
      CORS_ORIGINS: ${LITE_ORIGIN:-http://188.68.41.4:18021}
      VECTOR_CHROMA_PERSIST_DIR: /data/chroma
      VECTOR_EMBEDDING_API_KEY: ""
      VECTOR_EMBEDDING_MODEL: ""
      VECTOR_EMBEDDING_BASE_URL: ""
      VECTOR_RERANK_EXTERNAL_API_KEY: ""
      VECTOR_RERANK_EXTERNAL_MODEL: ""
      VECTOR_RERANK_EXTERNAL_BASE_URL: ""
      LINUXDO_OIDC_CLIENT_ID: ""
      LINUXDO_OIDC_CLIENT_SECRET: ""
    volumes:
      - lite_data:/data
    expose:
      - "8000"
    networks:
      - lite_net
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 96
    init: true
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  lite:
    build:
      context: ../../.reference-sources/lite/frontend
      dockerfile: ../../../deploy/reference-lab/lite/Dockerfile.frontend
    image: reference-lab-lite-web:d3bce7437861
    depends_on:
      lite-api:
        condition: service_healthy
    volumes:
      - ./lite/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lite/nginx-main.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "80"
    networks:
      - lite_net
    mem_limit: 32m
    cpus: 0.25
    pids_limit: 32
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

volumes:
  lite_data:

networks:
  # The primary's session-auth gateway joins this network and proxies lite:80.
  # Do not add an external/default network to lite-api.
  lite_net:
    internal: true
